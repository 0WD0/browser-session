name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: macos-13
            target: x86_64-apple-darwin
            extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          elisp_version="$(sed -n 's/^;; Version: //p' browser-session.el)"
          test "$version" = "$cargo_version"
          test "$version" = "$elisp_version"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          asset="browser-session-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.extension }}"
          cp "target/${{ matrix.target }}/release/browser-session${{ matrix.extension }}" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: browser-session-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
