name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path Cargo.toml -- --check
      - run: cargo clippy --manifest-path Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path Cargo.toml --locked

  emacs:
    name: Emacs 29.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: "29.1"
      - run: make elisp-check
